# Sobe um PostgreSQL com dois bancos: "erp" (sistema novo) e "legado"
# (cópia do ERP antigo, restaurada do .backup). Uso:
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data
      - ./backups:/backups

volumes:
  dados:
