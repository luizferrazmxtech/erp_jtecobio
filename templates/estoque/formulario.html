{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
{% if form.non_field_errors %}<div class="msg erro">{% for e in form.non_field_errors %}{{ e }}<br>{% endfor %}</div>{% endif %}
<form method="post">{% csrf_token %}
  {{ form.as_p }}
  <button>Registrar</button> <a href="{% url 'estoque:saldos' %}">Cancelar</a>
</form>
{% endblock %}
