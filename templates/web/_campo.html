{% if campo.field.widget.input_type == "checkbox" %}
<div class="campo marcar{% if campo.errors %} com-erro{% endif %}">{{ campo }}<label for="{{ campo.id_for_label }}">{{ campo.label|capfirst }}</label></div>
{% else %}
<div class="campo{% if campo.field.widget.attrs.rows or campo.name == 'observacao' or campo.name == 'motivo' %} inteiro{% endif %}{% if campo.errors %} com-erro{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label|capfirst }}{% if campo.field.required %} <span class="obrigatorio">*</span>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<span class="ajuda">{{ campo.help_text }}</span>{% endif %}
  {% for e in campo.errors %}<span class="erro">{{ e }}</span>{% endfor %}
</div>
{% endif %}
