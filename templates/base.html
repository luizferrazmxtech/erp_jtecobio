{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ERP JT Ecobio{% endblock %}</title>
  <style>
    :root { --cor: #0f766e; --borda: #d4d4d8; --fundo: #fafafa; --texto: #18181b; --suave: #71717a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--fundo); color: var(--texto); }
    header { background: var(--cor); color: #fff; padding: 12px 24px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
    header a { color: #fff; text-decoration: none; }
    header strong { margin-right: auto; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--borda); text-align: left; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tfoot td { font-weight: 600; }
    .msg { padding: 10px 14px; border-radius: 6px; background: #ecfdf5; border: 1px solid #a7f3d0; margin-bottom: 16px; }
    .erro { background: #fef2f2; border-color: #fecaca; }
    .acoes a { display: inline-block; margin: 0 8px 8px 0; padding: 8px 12px; border: 1px solid var(--cor); border-radius: 6px; color: var(--cor); text-decoration: none; }
    form p { margin: 0 0 12px; }
    form label { display: block; font-weight: 600; margin-bottom: 4px; }
    input, select, textarea { width: 100%; max-width: 420px; padding: 6px 8px; border: 1px solid var(--borda); border-radius: 4px; font: inherit; }
    .helptext { display: block; color: var(--suave); font-size: .85em; }
    button { padding: 8px 16px; background: var(--cor); color: #fff; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
    .suave { color: var(--suave); }
  </style>
</head>
<body>
<header>
  <strong>ERP JT Ecobio</strong>
  <a href="{% url 'estoque:saldos' %}">Estoque</a>
  <a href="{% url 'admin:index' %}">Cadastros</a>
  {% if user.is_authenticated %}<span>{{ user.get_username }}</span>
  <form method="post" action="{% url 'admin:logout' %}" style="margin:0">{% csrf_token %}<button style="padding:4px 10px">Sair</button></form>{% endif %}
</header>
<main>
  {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
  {% block conteudo %}{% endblock %}
</main>
</body>
</html>
